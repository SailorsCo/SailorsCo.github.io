<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roll Color Dice</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Titan+One&display=swap" rel="stylesheet">

<style>
:root {
  --panel: rgba(25, 30, 44, .70);
  --blue: #168bff;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  color: white;
  font-family: "Nunito", Arial, sans-serif;
  font-weight: 900;
  background: #202838;
}

#background {
  position: fixed;
  inset: 0;
  z-index: -2;
  background-image: url("https://sailorsco.github.io/cdn/img/Klayblox%20BG.jpeg");
  background-position: center;
  background-size: cover;
}

#background::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,.58);
}

/* NEW: Three-column page layout */

.site-layout {
  width: min(1440px, 98%);
  margin: auto;
  padding: 0 12px;
  display: grid;
  grid-template-columns: minmax(150px, 1fr) minmax(0, 760px) minmax(200px, 1fr);
  gap: 18px;
  align-items: start;
}

.page {
  width: 100%;
  min-width: 0;
  margin: 0;
  padding: 22px 0 40px;
}

/* NEW: Left-side Google Ad placeholder */

.ad-side {
  min-width: 0;
  padding-top: 22px;
}

.ad-placeholder {
  min-height: 250px;
  width: 100%;
  margin-bottom: 18px;
}

/* NEW: Right-side containers */

.right-side {
  min-width: 0;
  padding-top: 22px;
}

.side-panel {
  width: 100%;
  min-width: 0;
  padding: 15px;
  margin-bottom: 18px;
}

.side-panel h2 {
  font-size: 21px;
  margin: 0 0 14px;
}

/* Trade Colors image */

.trade-image {
  display: block;
  width: 100%;
  height: auto;
  object-fit: contain;
  border-radius: 9px;
}

/* Rules text field */

#rulesText {
  display: block;
  width: 100%;
  min-height: 150px;
  resize: vertical;
  padding: 12px;
  border: 3px solid #d2dcf1;
  border-radius: 11px;
  background: #f6f8ff;
  color: #22283a;
  font-family: "Nunito", Arial, sans-serif;
  font-size: 14px;
  font-weight: 800;
  line-height: 1.5;
}

#rulesText:focus-visible {
  outline: 3px solid #8ad4ff;
  outline-offset: 3px;
}

.side-toggle {
  width: 100%;
  margin-top: 12px;
  padding: 11px 10px;
  border: 3px solid white;
  border-radius: 11px;
  background: #46536c;
  color: white;
  font-family: inherit;
  font-size: 13px;
  font-weight: 900;
  box-shadow: 0 4px 0 rgba(0,0,0,.35);
  transition: transform .12s, filter .12s;
}

.side-toggle:hover {
  filter: brightness(1.15);
}

.side-toggle:active {
  transform: translateY(2px);
}

.side-toggle.active {
  background: #20ae69;
}

/* Responsive layout for tablets */

@media (max-width: 1050px) {
  .site-layout {
    grid-template-columns: minmax(0, 1fr) minmax(0, 2fr);
    gap: 16px;
  }

  .ad-side {
    display: none;
  }

  .page {
    grid-column: 1;
    grid-row: 1;
  }

  .right-side {
    grid-column: 2;
    grid-row: 1;
  }
}

/* Responsive layout for phones */

@media (max-width: 700px) {
  .site-layout {
    width: min(760px, 100%);
    padding: 0 12px;
    grid-template-columns: minmax(0, 1fr);
    gap: 0;
  }

  .page {
    grid-column: 1;
    grid-row: 1;
    padding-top: 16px;
  }

  .right-side {
    grid-column: 1;
    grid-row: 2;
    padding-top: 0;
  }

  .ad-side {
    display: block;
    grid-column: 1;
    grid-row: 3;
    padding-top: 0;
  }

  .ad-placeholder {
    min-height: 100px;
  }

  .right-side {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 0;
  }
}

.logo-wrap {
  display: flex;
  justify-content: center;
  margin-bottom: 20px;
}

.logo {
  width: min(230px, 65%);
  height: 105px;
  object-fit: contain;
  filter: drop-shadow(0 5px 0 rgba(0,0,0,.3));
}

.panel {
  background: var(--panel);
  border: 3px solid white;
  border-radius: 19px;
  box-shadow: 0 8px 0 rgba(0,0,0,.38);
  padding: 23px;
  margin-bottom: 23px;
}

h1, h2 {
  font-family: "Titan One", "Nunito", sans-serif;
  text-align: center;
  text-shadow: 0 3px 0 rgba(0,0,0,.35);
}

h1 {
  font-size: clamp(27px, 5vw, 38px);
  margin: 0 0 25px;
  transition: filter .2s;
}

h2 {
  font-size: 23px;
  margin: 0 0 18px;
}

.settings {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  margin-bottom: 24px;
  transition: filter .2s;
}

.field label {
  display: block;
  margin-bottom: 8px;
  font-size: 13px;
  color: #d9e6ff;
  text-transform: uppercase;
  letter-spacing: .5px;
}

select, button, input {
  font: inherit;
}

select {
  width: 100%;
  padding: 12px;
  background: #f6f8ff;
  color: #22283a;
  border: 3px solid #d2dcf1;
  border-radius: 11px;
  font-weight: 900;
  cursor: pointer;
}

button { cursor: pointer; }

button:focus-visible, select:focus-visible, input:focus-visible {
  outline: 3px solid #8ad4ff;
  outline-offset: 3px;
}

.dice-area {
  position: relative;
  min-height: 145px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: clamp(8px, 0vw, 20px);
  flex-wrap: nowrap;
  margin: 12px 0 23px;
  overflow: hidden;
  isolation: isolate;
  transition: filter .2s;
}

.dice {
  width: clamp(54px, 14vw, 112px);
  aspect-ratio: 1;
  flex: 1 1 0;
  max-width: 112px;
  min-width: 0;
  border: 10px solid white;
  border-radius: 22%;
  box-shadow: 0 7px 0 rgba(0,0,0,.35),
              inset 0 -5px 0 rgba(0,0,0,.14);
  display: flex;
  justify-content: center;
  align-items: center;
  animation: dicePop .25s ease;
}

.dice-dot {
  width: 24%;
  aspect-ratio: 1;
  background: white;
  border-radius: 50%;
  box-shadow: 0 1px 2px rgba(0,0,0,.2);
}

.red { background-color: #db0f0f; }
.blue { background-color: #004cff; }
.green { background-color: #0aab28; }
.yellow { background-color: #ffc200; }
.purple { background-color: #7600ff; }
.orange { background-color: #ff7a00; }

@keyframes dicePop {
  0% { transform: scale(.8) rotate(-8deg); }
  100% { transform: scale(1) rotate(0); }
}

.dice.rolling {
  animation: shake .35s ease-in-out infinite;
}

@keyframes shake {
  0%, 100% { transform: rotate(0) scale(1); }
  25% { transform: rotate(-9deg) scale(.95); }
  50% { transform: rotate(9deg) scale(1.04); }
  75% { transform: rotate(-5deg) scale(.98); }
}

.main-button {
  width: 100%;
  background: #168bff;
  color: white;
  border: 3px solid white;
  border-radius: 13px;
  padding: 14px 18px;
  font-size: 21px;
  font-weight: 900;
  box-shadow: 0 6px 0 #0755ad;
  text-shadow: 0 2px 0 rgba(0,0,0,.25);
  transition: transform .12s, box-shadow .12s;
}

.main-button:hover {
  background: #38a0ff;
  transform: translateY(-2px);
  box-shadow: 0 8px 0 #0755ad;
}

.main-button:active {
  transform: translateY(4px);
  box-shadow: 0 2px 0 #0755ad;
}

.main-button:disabled {
  cursor: wait;
  transform: none;
}

.result-text {
  text-align: center;
  margin: 16px 0 0;
  color: #e2ebff;
  font-size: 14px;
}

/* Blur and surprise controls */

.effect-buttons {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  margin-bottom: 18px;
}

.effect-button {
  width: 100%;
  padding: 11px 15px;
  border: 3px solid white;
  border-radius: 12px;
  color: white;
  background: #46536c;
  font-size: 15px;
  font-weight: 900;
  box-shadow: 0 4px 0 rgba(0,0,0,.35);
}

.effect-button:hover { filter: brightness(1.15); }
.effect-button.active { background: #8a48e8; }

.blurred {
  filter: blur(7px);
}

.dice-curtain {
  position: absolute;
  z-index: 5;
  top: 0;
  bottom: 0;
  left: 0;
  width: 100%;
  background: #000;
  transform: translateX(0%);
  pointer-events: none;
  will-change: transform;
}

.surprise-controls {
  margin: -8px 0 20px;
  padding: 13px;
  border: 2px solid rgba(255,255,255,.35);
  border-radius: 12px;
  background: rgba(0,0,0,.3);
}

.surprise-controls[hidden] { display: none; }

.surprise-controls label {
  display: block;
  text-align: center;
  margin-bottom: 12px;
  font-size: 14px;
}

#revealSlider {
  width: 100%;
  accent-color: #168bff;
  cursor: ew-resize;
}

.slider-labels {
  display: flex;
  justify-content: space-between;
  color: #d9e6ff;
  font-size: 12px;
}

/* Character and number counter */

.counter-panel { padding: 19px; }

.counter-layout {
  display: grid;
  grid-template-columns: minmax(110px, 1fr) 2fr;
  gap: 16px;
  align-items: center;
}

.character-side { min-width: 0; }

.character-side label {
  display: block;
  text-align: center;
  font-size: 12px;
  color: #d9e6ff;
  margin-bottom: 8px;
}

.character-preview {
  width: 100%;
  height: 105px;
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 8px 0;
}

.character-preview img {
  max-width: 100%;
  width: 100%;
  height: 105px;
  object-fit: contain;
}

.fallback-name {
  display: none;
  text-align: center;
  font-size: 12px;
  overflow-wrap: anywhere;
}

.counter-title {
  font-size: 12px;
  text-transform: uppercase;
  color: #d9e6ff;
  text-align: center;
  margin-bottom: 9px;
  letter-spacing: .5px;
}

.counter {
  display: grid;
  grid-template-columns: 1fr 1.2fr 1fr;
  align-items: center;
  gap: 5px;
  background: rgba(0,0,0,.27);
  border: 2px solid rgba(255,255,255,.3);
  border-radius: 15px;
  padding: 9px;
}

.counter-buttons {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.counter-btn {
  border: 2px solid white;
  color: white;
  border-radius: 9px;
  background: #39465e;
  font-size: 13px;
  font-weight: 900;
  padding: 10px 3px;
  box-shadow: 0 3px 0 rgba(0,0,0,.3);
}

.counter-btn:hover { filter: brightness(1.2); }
.minus { background: #ec4e55; }
.plus { background: #20ae69; }

#counterValue {
  text-align: center;
  font-family: "Titan One", sans-serif;
  font-size: clamp(23px, 5vw, 37px);
  overflow-wrap: anywhere;
}

.possible {
  text-align: center;
  line-height: 2;
  font-size: 14px;
  margin: 20px 0 0;
}

.possible span { white-space: nowrap; margin: 0 2px; }
.color-red { color: #ff5757; }
.color-orange { color: #ff7a00; }
.color-yellow { color: #ffda48; }
.color-green { color: #4ee78a; }
.color-blue { color: #65b7ff; }
.color-purple { color: #c18aff; }

/* History */

.history-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 15px;
}

.history-heading h2 {
  text-align: left;
  margin: 0;
}

.clear-button {
  padding: 7px 11px;
  color: white;
  background: #46536c;
  border: 2px solid white;
  border-radius: 9px;
  font-size: 12px;
}

.history-list {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.history-empty {
  text-align: center;
  color: #c5d1e8;
  font-size: 14px;
  padding: 15px 0 4px;
}

.history-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  background: rgba(255,255,255,.07);
  border: 2px solid rgba(255,255,255,.17);
  border-radius: 11px;
  padding: 10px 12px;
  font-size: 13px;
}

.history-left {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.mini-dice {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid white;
  border-radius: 4px;
  vertical-align: middle;
}

.history-number {
  color: white;
  font-family: "Titan One", sans-serif;
  white-space: nowrap;
}

.footer {
  text-align: center;
  color: #e0e8f8;
  font-size: 12px;
  opacity: .85;
  margin-top: 22px;
}

@media (max-width: 430px) {
  .panel { padding: 16px; }
  .settings { gap: 10px; }

  .counter-layout {
    grid-template-columns: 94px minmax(0, 1fr);
    gap: 10px;
  }

  .counter { padding: 6px 4px; gap: 3px; }
  .counter-btn { font-size: 12px; padding: 9px 2px; }
  .character-preview, .character-preview img { height: 85px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>

     crossorigin="anonymous"></script>

</head>

<body>
<div id="background"></div>

<!-- NEW: Main layout wrapper -->

<div class="site-layout">

  <!-- NEW: Left-side ad placeholder -->

  <aside class="ad-side" aria-label="Advertisement">
    <div class="panel ad-placeholder" id="adPlaceholder">
      <!-- Google Ad banner can be added here later -->
    </div>
  </aside>

  <!-- ORIGINAL DICE GAME -->

  <main class="page">

    <section class="panel">
      <h1 id="mainHeading">Roll color dice</h1>

      <div class="settings" id="settings">
        <div class="field">
          <label for="diceCount">Number of dice</label>
          <select id="diceCount">
            <option value="1">1 Dice</option>
            <option value="2" selected>2 Dice</option>
            <option value="3">3 Dice</option>
            <option value="4">4 Dice</option>
          </select>
        </div>

        <div class="field">
          <label for="backgroundChoice">Background</label>
          <select id="backgroundChoice">
            <option value="klayblox">KlayBlox</option>
            <option value="lapeace">La Peace</option>
            <option value="upload">Upload image</option>
          </select>
          <input type="file" id="backgroundUpload" accept="image/*" hidden>
        </div>
      </div>

      <div class="dice-area" id="diceArea" aria-live="polite"></div>

      <div class="effect-buttons">
        <button type="button" id="blurButton" class="effect-button">
          Blur: OFF
        </button>
        <button type="button" id="surpriseButton" class="effect-button">
          Surprise Reveal: OFF
        </button>
      </div>

      <div class="surprise-controls" id="surpriseControls" hidden>
        <label for="revealSlider">Slide to reveal your colors!</label>
        <input type="range" id="revealSlider" min="0" max="100" value="0" step="1">
        <div class="slider-labels">
          <span>Hidden</span>
          <span>Revealed</span>
        </div>
      </div>

      <button class="main-button" id="rollButton">Roll Color Dice!</button>

      <p class="result-text" id="resultText" aria-live="polite">
        Choose your dice and roll!
      </p>

      <p class="possible">
        Possible colors are:
        <span class="color-red">Red</span>,
        <span class="color-orange">Orange</span>,
        <span class="color-yellow">Yellow</span>,
        <span class="color-green">Green</span>,
        <span class="color-blue">Blue</span> and
        <span class="color-purple">Purple</span>.
      </p>
    </section>

    <section class="panel counter-panel">
      <div class="counter-layout">
        <div class="character-side">
          <label for="characterChoice">Character</label>
          <select id="characterChoice">
            <option value="garama">Garama and madungdung</option>
            <option value="colored">Colored Garama</option>
            <option value="dragon">Dragon Cannelloni</option>
          </select>

          <div class="character-preview">
            <img id="characterImage"
              src="https://static.wikia.nocookie.net/stealabr/images/e/ee/Garamadundung.png/revision/latest?cb=20250816022557"
              alt="Garama and madungdung">
            <span class="fallback-name" id="characterFallback"></span>
          </div>
        </div>

        <div class="counter-side">
          <div class="counter-title">Your number</div>
          <div class="counter">
            <div class="counter-buttons">
              <button class="counter-btn minus" data-change="-10">-10</button>
              <button class="counter-btn minus" data-change="-1">-1</button>
            </div>

            <div id="counterValue">+0</div>

            <div class="counter-buttons">
              <button class="counter-btn plus" data-change="1">+1</button>
              <button class="counter-btn plus" data-change="10">+10</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="history-heading">
        <h2>Roll History</h2>
        <button class="clear-button" id="clearHistory">Clear History</button>
      </div>
      <div class="history-list" id="historyList">
        <div class="history-empty">Your last 10 rolls will appear here!</div>
      </div>
    </section>

    <p class="footer">Made by KlayBlox for color dice lovers · Good luck!</p>
  </main>

  <!-- NEW: Three right-side containers -->

  <aside class="right-side" aria-label="Game options">

    <!-- Top container: Trade Colors image -->

    <section class="panel side-panel">
      <img
        class="trade-image"
        src="https://sailorsco.github.io/cdn/img/Trade%20Colors.png"
        alt="Trade Colors">
    </section>

    <!-- Middle container: Rules -->

    <section class="panel side-panel">
      <h2>Rules</h2>

      <textarea
        id="rulesText"
        placeholder="Write your rules here..."
        aria-label="Game rules"
      ></textarea>

      <button
        type="button"
        id="defaultRulesToggle"
        class="side-toggle"
        aria-pressed="false"
      >
        Default Rules: OFF
      </button>
    </section>

    <!-- Bottom container: Double Reject -->

    <section class="panel side-panel">
      <h2>Double Reject</h2>

      <button
        type="button"
        id="doubleRejectToggle"
        class="side-toggle"
        aria-pressed="false"
      >
        Double Reject: OFF
      </button>
    </section>

  </aside>

</div>

<script>
const colors = [
  { name: "Red", className: "red" },
  { name: "Blue", className: "blue" },
  { name: "Green", className: "green" },
  { name: "Yellow", className: "yellow" },
  { name: "Purple", className: "purple" },
  { name: "Orange", className: "orange" }
];

const backgrounds = {
  klayblox: "https://sailorsco.github.io/cdn/img/Klayblox%20BG.jpeg",
  lapeace: "https://images4.alphacoders.com/141/1412936.png"
};

const characters = {
  garama: {
    name: "Garama and madungdung",
    image: "https://static.wikia.nocookie.net/stealabr/images/e/ee/Garamadundung.png/revision/latest?cb=20250816022557"
  },
  colored: {
    name: "Colored Garama",
    image: "https://bloxcart.com/_next/image?url=https%3A%2F%2Fcdn.shopify.com%2Fs%2Ffiles%2F1%2F0815%2F2068%2F9482%2Ffiles%2F7_-_BJBZpvy.png%3Fv%3D1760883876&w=3840&q=75"
  },
  dragon: {
    name: "Dragon Cannelloni",
    image: "https://static.wikia.nocookie.net/stealabr/images/a/a5/Dragon_Cannelloni.png/revision/latest/scale-to-width-down/1200?cb=20260428162417"
  }
};

const diceCount = document.getElementById("diceCount");
const diceArea = document.getElementById("diceArea");
const rollButton = document.getElementById("rollButton");
const resultText = document.getElementById("resultText");
const counterValue = document.getElementById("counterValue");
const historyList = document.getElementById("historyList");
const backgroundChoice = document.getElementById("backgroundChoice");
const backgroundUpload = document.getElementById("backgroundUpload");
const characterChoice = document.getElementById("characterChoice");
const characterImage = document.getElementById("characterImage");
const characterFallback = document.getElementById("characterFallback");

const blurButton = document.getElementById("blurButton");
const surpriseButton = document.getElementById("surpriseButton");
const surpriseControls = document.getElementById("surpriseControls");
const revealSlider = document.getElementById("revealSlider");

const rollSound = new Audio(
  "https://sailorsco.github.io/cdn/audio/Dice%20roll%20sound.m4a"
);
rollSound.preload = "auto";

let number = 0;
let history = [];
let currentDice = [];
let blurEnabled = false;
let surpriseEnabled = false;
let rollInProgress = false;
let uploadUrl = null;
let rollToken = 0;

/* NEW: Rules toggle */

const rulesText = document.getElementById("rulesText");
const defaultRulesToggle = document.getElementById("defaultRulesToggle");

const defaultRules = `1X Win
2X Recolor
3X Recolor
4X Win

2X Recolor = Loss`;

let defaultRulesEnabled = false;
let customRulesText = "";

rulesText.addEventListener("input", () => {
  if (!defaultRulesEnabled) {
    customRulesText = rulesText.value;
  }
});

defaultRulesToggle.addEventListener("click", () => {
  defaultRulesEnabled = !defaultRulesEnabled;

  if (defaultRulesEnabled) {
    customRulesText = rulesText.value;
    rulesText.value = defaultRules;
  } else {
    rulesText.value = customRulesText;
  }

  defaultRulesToggle.textContent = defaultRulesEnabled
    ? "Default Rules: ON"
    : "Default Rules: OFF";

  defaultRulesToggle.classList.toggle(
    "active",
    defaultRulesEnabled
  );

  defaultRulesToggle.setAttribute(
    "aria-pressed",
    String(defaultRulesEnabled)
  );
});

/* NEW: Double Reject toggle */

const doubleRejectToggle = document.getElementById("doubleRejectToggle");

let doubleRejectEnabled = false;

doubleRejectToggle.addEventListener("click", () => {
  doubleRejectEnabled = !doubleRejectEnabled;

  doubleRejectToggle.textContent = doubleRejectEnabled
    ? "Double Reject: ON"
    : "Double Reject: OFF";

  doubleRejectToggle.classList.toggle(
    "active",
    doubleRejectEnabled
  );

  doubleRejectToggle.setAttribute(
    "aria-pressed",
    String(doubleRejectEnabled)
  );
});

/* Create dice */

function createDice() {
  diceArea.querySelectorAll(".dice").forEach(die => die.remove());

  const count = Number(diceCount.value);

  for (let i = 0; i < count; i++) {
    const die = document.createElement("div");
    const color = currentDice[i] || colors[i % colors.length];

    die.className = "dice " + color.className;
    die.innerHTML = '<span class="dice-dot"></span>';
    die.setAttribute("aria-label", color.name);

    diceArea.insertBefore(
      die,
      diceArea.querySelector(".dice-curtain")
    );
  }
}

diceCount.addEventListener("change", () => {
  if (rollInProgress) return;

  currentDice = [];
  createDice();

  resultText.textContent = "Ready to roll " + diceCount.value + " dice!";

  if (surpriseEnabled) {
    setCurtain(0);
  }
});

/* Blur toggle */

blurButton.addEventListener("click", () => {
  blurEnabled = !blurEnabled;

  document.getElementById("mainHeading")
    .classList.toggle("blurred", blurEnabled);

  document.getElementById("settings")
    .classList.toggle("blurred", blurEnabled);

  diceArea.classList.toggle("blurred", blurEnabled);

  blurButton.textContent = blurEnabled ? "Blur: ON" : "Blur: OFF";
  blurButton.classList.toggle("active", blurEnabled);
});

/* Surprise Reveal toggle */

surpriseButton.addEventListener("click", () => {
  surpriseEnabled = !surpriseEnabled;

  surpriseButton.textContent = surpriseEnabled
    ? "Surprise Reveal: ON"
    : "Surprise Reveal: OFF";

  surpriseButton.classList.toggle("active", surpriseEnabled);
  surpriseControls.hidden = !surpriseEnabled;

  if (surpriseEnabled && currentDice.length) {
    setCurtain(0);
    resultText.textContent = "Slide to reveal your colors!";
  } else {
    removeCurtain();
  }
});

/* Black curtain */

function setCurtain(value) {
  let curtain = diceArea.querySelector(".dice-curtain");

  if (!curtain) {
    curtain = document.createElement("div");
    curtain.className = "dice-curtain";
    curtain.setAttribute("aria-hidden", "true");
    diceArea.appendChild(curtain);
  }

  curtain.style.transform = `translateX(${value}%)`;
}

function removeCurtain() {
  const curtain = diceArea.querySelector(".dice-curtain");
  if (curtain) curtain.remove();
}

revealSlider.addEventListener("input", () => {
  if (diceArea.querySelector(".dice-curtain")) {
    setCurtain(revealSlider.value);
  }

  if (Number(revealSlider.value) >= 100) {
    resultText.textContent = "All colors revealed!";
  } else if (surpriseEnabled && currentDice.length) {
    resultText.textContent = "Slide to reveal your colors!";
  }
});

/* Roll dice with sound and a two-second delay */

function rollDice() {
  if (rollInProgress) return;

  rollInProgress = true;
  rollButton.disabled = true;
  rollButton.style.opacity = ".7";

  const token = ++rollToken;

  rollSound.pause();
  rollSound.currentTime = 0;
  rollSound.play().catch(() => {});

  const results = Array.from(
    { length: Number(diceCount.value) },
    () => colors[Math.floor(Math.random() * colors.length)]
  );

  removeCurtain();

  if (surpriseEnabled) {
    revealSlider.value = 0;
    setCurtain(0);
  }

  diceArea.querySelectorAll(".dice").forEach(die => {
    die.classList.add("rolling");
  });

  resultText.textContent = "Rolling...";

  setTimeout(() => {
    if (token !== rollToken) return;

    currentDice = results;
    createDice();

    diceArea.classList.toggle("blurred", blurEnabled);

    const names = currentDice.map(color => color.name);

    if (surpriseEnabled) {
      setCurtain(revealSlider.value);
      resultText.textContent = "Your colors are hidden! Slide to reveal them.";
    } else {
      removeCurtain();
      resultText.textContent = "You rolled: " + names.join(", ") + "!";
    }

    rollButton.textContent = "Roll Again";
    rollButton.disabled = false;
    rollButton.style.opacity = "1";
    rollInProgress = false;

    addHistory(names);
  }, 2000);
}

rollButton.addEventListener("click", rollDice);

/* Counter */

function updateCounter() {
  counterValue.textContent = number >= 0 ? "+" + number : String(number);
}

document.querySelectorAll("[data-change]").forEach(button => {
  button.addEventListener("click", () => {
    number += Number(button.dataset.change);
    updateCounter();
  });
});

/* Background selection */

function setBackground(url) {
  document.getElementById("background").style.backgroundImage =
    `url("${url}")`;
}

backgroundChoice.addEventListener("change", () => {
  const choice = backgroundChoice.value;

  if (choice === "upload") {
    backgroundUpload.click();
  } else {
    setBackground(backgrounds[choice]);
  }
});

backgroundUpload.addEventListener("change", () => {
  const file = backgroundUpload.files[0];

  if (!file) return;

  if (!file.type.startsWith("image/")) {
    alert("Please select a valid image.");
    return;
  }

  if (uploadUrl) URL.revokeObjectURL(uploadUrl);

  uploadUrl = URL.createObjectURL(file);
  setBackground(uploadUrl);
});

/* Character images with fallback names */

function setCharacter() {
  const character = characters[characterChoice.value];

  characterImage.style.display = "block";
  characterFallback.style.display = "none";
  characterImage.alt = character.name;
  characterImage.onerror = () => {
    characterImage.style.display = "none";
    characterFallback.textContent = character.name;
    characterFallback.style.display = "block";
  };

  characterImage.src = character.image;
}

characterChoice.addEventListener("change", setCharacter);

/* Last ten rolls */

function addHistory(names) {
  history.unshift({
    names: [...names],
    number: number,
    time: new Date().toLocaleTimeString([], {
      hour: "2-digit",
      minute: "2-digit"
    })
  });

  history = history.slice(0, 10);
  renderHistory();
}

function renderHistory() {
  historyList.innerHTML = "";

  if (!history.length) {
    historyList.innerHTML =
      '<div class="history-empty">Your last 10 rolls will appear here!</div>';
    return;
  }

  history.forEach((entry, index) => {
    const item = document.createElement("div");
    item.className = "history-item";

    const left = document.createElement("div");
    left.className = "history-left";

    const rollNo = document.createElement("span");
    rollNo.textContent = "#" + (index + 1);
    left.appendChild(rollNo);

    entry.names.forEach(name => {
      const color = colors.find(c => c.name === name);
      if (!color) return;

      const mini = document.createElement("span");
      mini.className = "mini-dice " + color.className;
      mini.title = name;
      mini.setAttribute("aria-label", name);
      left.appendChild(mini);
    });

    const label = document.createElement("span");
    label.textContent = entry.names.join(", ");
    left.appendChild(label);

    const right = document.createElement("div");
    right.style.textAlign = "right";

    const score = document.createElement("div");
    score.className = "history-number";
    score.textContent = entry.number >= 0
      ? "+" + entry.number
      : String(entry.number);

    const time = document.createElement("small");
    time.textContent = entry.time;
    time.style.color = "#c5d1e8";

    right.appendChild(score);
    right.appendChild(time);
    item.appendChild(left);
    item.appendChild(right);
    historyList.appendChild(item);
  });
}

document.getElementById("clearHistory").addEventListener("click", () => {
  history = [];
  renderHistory();
});

/* Initialize */

createDice();
setCharacter();
updateCounter();
renderHistory();
</script>
</body>
</html>
